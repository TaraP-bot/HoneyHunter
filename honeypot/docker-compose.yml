version: '3.8'

services:
  honeypot:
    build: .
    container_name: honeypot
    restart: unless-stopped
    ports:
      # Map standard ports to honeypot ports.
      # Set HONEYPOT_BIND_IP in .env (gitignored) to the public IP when sshd
      # listens on a specific address (e.g. Tailscale) on port 22: Linux
      # refuses a 0.0.0.0:22 bind alongside it.
      - "${HONEYPOT_BIND_IP:-0.0.0.0}:80:8080"      # HTTP
      - "${HONEYPOT_BIND_IP:-0.0.0.0}:22:2222"      # SSH
      - "${HONEYPOT_BIND_IP:-0.0.0.0}:21:2121"      # FTP
      - "${HONEYPOT_BIND_IP:-0.0.0.0}:53:5353/tcp"  # DNS
    volumes:
      # Persistent data storage
      - ./honeypot_data:/app/honeypot_data
      # Custom configuration (optional)
      - ./honeypot_config.json:/app/honeypot_config.json:ro
    networks:
      - honeypot_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=UTC
      # Least-privilege ES user created by es-setup; passwords live in .env
      - ES_USERNAME=honeypot_writer
      - ES_PASSWORD=${HONEYPOT_ES_PASSWORD:?Set HONEYPOT_ES_PASSWORD in .env}
    # Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Only if using ports < 1024

  # Optional: ElasticSearch for telemetry storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: honeypot_elasticsearch
    environment:
      - discovery.type=single-node
      # Authentication on; TLS off as ES is only reachable on honeypot_net
      # and 127.0.0.1
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - honeypot_net
    restart: unless-stopped

  # One-shot: sets the kibana_system password and creates honeypot_writer
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: honeypot_es_setup
    entrypoint: ["bash", "/es-setup.sh"]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD in .env}
      - HONEYPOT_ES_PASSWORD=${HONEYPOT_ES_PASSWORD:?Set HONEYPOT_ES_PASSWORD in .env}
    volumes:
      - ./es-setup.sh:/es-setup.sh:ro
    networks:
      - honeypot_net
    depends_on:
      - elasticsearch
    restart: "no"

  # Optional: Kibana for visualization (log in as elastic)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: honeypot_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD in .env}
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - honeypot_net
    depends_on:
      es-setup:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  honeypot_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  elasticsearch_data:
    driver: local
